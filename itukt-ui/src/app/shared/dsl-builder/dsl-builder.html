<mat-card>
    <mat-card-content>
        <expression identifier="ALDER =" [action]="appendAge">
            <mat-form-field class="age-operator">
                <mat-select [(ngModel)]="selectedAgeOperator">
                    @for (operator of ageOperators; track operator) {
                    <mat-option [value]="operator">
                        {{ operator }}
                    </mat-option>
                    }
                </mat-select>
            </mat-form-field>
            <mat-form-field>
                <input matInput type="number" [(ngModel)]="selectedAgeValue" />
            </mat-form-field>
        </expression>

        <expression identifier="INDIKATION =" [action]="appendIndication">
            <mat-form-field>
                <input matInput [(ngModel)]="selectedIndicationValue" />
            </mat-form-field>
        </expression>

        <expression identifier="LÆGESPECIALE =" [action]="appendDoctorSpeciality">
            <mat-form-field>
                <input matInput [(ngModel)]="selectedDoctorSpecialityValue" />
            </mat-form-field>
        </expression>

    </mat-card-content>
</mat-card>
