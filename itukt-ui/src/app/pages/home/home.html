<div class="content">
  <app-toolbar />

  @if (app.userLoggedIn() && app.userAuthorized()) {
  <app-clause-tabs />
  } 
  @else if(app.userLoggedIn() == undefined || app.userAuthorized() == undefined) {
  <mat-spinner diameter="50"></mat-spinner>
  } 
  @else if(!app.userLoggedIn()) {
      <button matButton="tonal" (click)="login()"><mat-icon fontIcon="login"></mat-icon> Log ind</button>
  } @else {
    <div class="no-access">
      <mat-icon fontIcon="error"></mat-icon>
      <p>Denne bruger har ikke adgang</p>
    </div>
  }
</div>
